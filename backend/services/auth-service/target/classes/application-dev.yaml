server:
  port: 8000
  servlet:
    context-path: /auth

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/linksphere
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

jwt:
  secret: "0f6a9a5e2c5b4d8f3a2b7c9d1e4f6a8b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5"
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
  issuer: "linksphere-auth-service"

redis:
  host: redis
  port: 6379
