server:
  port: ${PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 100MB
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notifications/**

        - id: post-service
          uri: lb://post-service
          predicates:
            - Path=/posts/**
