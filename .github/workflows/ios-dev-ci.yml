name: LinkedSphere iOS DEV CI

on:
    push:
        branches:
            - develop

    pull_request:
        branches:
            - develop

jobs:
    ios-ci:
        name: iOS DEV CI
        runs-on: macos-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true

            - name: Flutter version
              run: flutter --version

            - name: Install dependencies
              run: flutter pub get

            - name: Check formatting
              run: dart format --output=none --set-exit-if-changed .

            - name: Analyze
              run: flutter analyze

            - name: Run tests
              run: flutter test

            - name: Build iOS DEV
              run: |
                  flutter build ios \
                    --flavor dev \
                    --dart-define=ENV=dev \
                    --no-codesign
