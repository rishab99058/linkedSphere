name: Frontend CI/CD

on:
  push:
    branches:
      - develop
    paths:
      - "frontend/**"
      - "scripts/detect-frontend-changes.sh"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches:
      - develop
    paths:
      - "frontend/**"
      - "scripts/detect-frontend-changes.sh"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Frontend Build & Push to GHCR
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================================
      # DETECT FRONTEND CHANGES
      # =========================================================
      - name: Detect Frontend Changes
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          chmod +x scripts/detect-frontend-changes.sh
          ./scripts/detect-frontend-changes.sh "$BASE_SHA" "$HEAD_SHA"

      # =========================================================
      # SETUP PNPM & NODE (FOR LINT/TYPECHECK/VALIDATION)
      # =========================================================
      - name: Setup Node.js
        if: steps.changes.outputs.frontend_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        if: steps.changes.outputs.frontend_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Dependencies & Verify Build
        if: steps.changes.outputs.frontend_changed == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: frontend/linkedSphere-web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # =========================================================
      # DOCKER / BUILDX
      # =========================================================
      - name: Set up Docker Buildx
        if: steps.changes.outputs.frontend_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      # =========================================================
      # GITHUB CONTAINER REGISTRY LOGIN
      # =========================================================
      - name: Login to GHCR
        if: steps.changes.outputs.frontend_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================
      # BUILD FRONTEND IMAGE
      # =========================================================
      - name: Build Frontend Image
        if: steps.changes.outputs.frontend_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "======================================"
          echo "Building linksphere-web"
          echo "Platform: linux/amd64"
          echo "======================================"

          docker buildx build \
            --platform linux/amd64 \
            -f frontend/linkedSphere-web/Dockerfile \
            -t "linksphere/web:${GITHUB_SHA}" \
            --load \
            frontend/linkedSphere-web

      # =========================================================
      # PUSH FRONTEND TO GHCR (BASED ON SHA)
      # =========================================================
      - name: Push Frontend Image to GHCR
        if: steps.changes.outputs.frontend_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "======================================"
          echo "Pushing linksphere-web to GHCR"
          echo "======================================"

          docker tag \
            "linksphere/web:${GITHUB_SHA}" \
            "ghcr.io/${{ github.repository_owner }}/linksphere-web:${GITHUB_SHA}"

          docker push \
            "ghcr.io/${{ github.repository_owner }}/linksphere-web:${GITHUB_SHA}"
