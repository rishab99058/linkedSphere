name: LinkedSphere Android DEV CI

on:
    push:
        branches:
            - develop

    pull_request:
        branches:
            - develop

jobs:
    android-ci:
        name: Android DEV CI
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: mobile

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true

            - name: Flutter version
              run: flutter --version

            - name: Add Dart Pub Cache to PATH
              run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

            - name: Install FlutterFire CLI
              run: dart pub global activate flutterfire_cli

            - name: Install dependencies
              run: flutter pub get

            - name: Analyze
              run: flutter analyze

            - name: Run tests
              run: flutter test

            - name: Build Android DEV APK
              run: |
                  flutter build apk \
                    --flavor dev \
                    --dart-define=ENV=dev

            - name: Find generated APK
              run: |
                  echo "Generated APK files:"
                  find build -type f -name "*.apk" -print

            - name: Upload APK to Firebase App Distribution
              uses: wzieba/Firebase-Distribution-Github-Action@v1
              with:
                  appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
                  serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
                  file: build/app/outputs/flutter-apk/app-dev-release.apk
                  groups: developers
                  releaseNotes: "DEV build from develop branch"
