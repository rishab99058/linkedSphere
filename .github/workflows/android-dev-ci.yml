name: LinkedSphere Android DEV

on:
  pull_request:
    branches:
      - develop

  push:
    branches:
      - develop

permissions:
  contents: read

jobs:

  # ============================================================
  # CI
  # ============================================================
  ci:
    name: Android CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test


  # ============================================================
  # CD
  # ============================================================
  cd:
    name: Android DEV CD
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build DEV APK
        run: |
          flutter build apk \
            --dart-define=ENV=dev

      - name: Verify APK
        run: |
          echo "Generated APK files:"
          find "$GITHUB_WORKSPACE" -type f -name "*.apk" -print

      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: ${{ github.workspace }}/mobile/build/app/outputs/flutter-apk/app-release.apk
          groups: developers
          releaseNotes: |
            LinkedSphere DEV build

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Build: ${{ github.run_number }}
