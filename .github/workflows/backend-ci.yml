name: Backend CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"

      - name: Verify Java
        run: "java --version"

      - name: Make Maven Wrapper Executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Verify Maven
        working-directory: backend
        run: "./mvnw --version"

      - name: Build Backend
        working-directory: backend
        run: "./mvnw clean verify -DskipTests"

      - name: Detect Affected Services
        id: affected
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          chmod +x scripts/detect-affected-services.sh
          ./scripts/detect-affected-services.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Show Affected Services
        env:
          AFFECTED_SERVICES: ${{ steps.affected.outputs.affected_services }}
        run: |
          echo "Services selected for deployment:"
          printf '%s\n' "$AFFECTED_SERVICES"

      - name: Build Affected Docker Images
        env:
          AFFECTED_SERVICES: ${{ steps.affected.outputs.affected_services }}
        run: |
          while IFS= read -r service; do

            [ -z "$service" ] && continue

            echo "Building Docker image for: $service"

            docker build \
              -f "backend/services/$service/Dockerfile" \
              -t "linksphere/$service:${GITHUB_SHA}" \
              backend

          done <<< "$AFFECTED_SERVICES"

      - name: Verify Build Images
        run: docker images

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/172614450127/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: linksphere-ci@linksphere-backend-dev.iam.gserviceaccount.com
