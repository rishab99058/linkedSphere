name: Backend CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"

      - name: Verify Java
        run: "java --version"

      - name: Make Maven Wrapper Executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Verify Maven
        working-directory: backend
        run: "./mvnw --version"

      - name: Build Backend
        working-directory: backend
        run: "./mvnw clean verify -DskipTests"

      - name: Detect Affected Services
        id: affected
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          chmod +x scripts/detect-affected-services.sh
          ./scripts/detect-affected-services.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Show Affected Services
        env:
          AFFECTED_SERVICES: ${{ steps.affected.outputs.affected_services }}
        run: |
          echo "Services selected for deployment:"
          printf '%s\n' "$AFFECTED_SERVICES"

      - name: Build Auth Service Image
        if: github.event_name == 'push' && contains(steps.affected.outputs.affected_services, 'auth-service')
        run: |
          echo "Building auth-service..."

          docker build \
            -f backend/services/auth-service/Dockerfile \
            -t "linksphere/auth-service:${GITHUB_SHA}" \
            backend

      - name: Build User Service Image
        if: github.event_name == 'push' && contains(steps.affected.outputs.affected_services, 'user-service')
        run: |
          echo "Building user-service..."

          docker build \
            -f backend/services/user-service/Dockerfile \
            -t "linksphere/user-service:${GITHUB_SHA}" \
            backend

      - name: Build Notification Service Image
        if: github.event_name == 'push' && contains(steps.affected.outputs.affected_services, 'notification-service')
        run: |
          echo "Building notification-service..."

          docker build \
            -f backend/services/notification-service/Dockerfile \
            -t "linksphere/notification-service:${GITHUB_SHA}" \
            backend

      - name: Build Gateway Service Image
        if: github.event_name == 'push' && contains(steps.affected.outputs.affected_services, 'gateway-service')
        run: |
          echo "Building gateway-service..."

          docker build \
            -f backend/services/gateway-service/Dockerfile \
            -t "linksphere/gateway-service:${GITHUB_SHA}" \
            backend

      - name: Build Discovery Server Image
        if: github.event_name == 'push' && contains(steps.affected.outputs.affected_services, 'discovery-server')
        run: |
          echo "Building discovery-server..."

          docker build \
            -f backend/services/discovery-server/Dockerfile \
            -t "linksphere/discovery-server:${GITHUB_SHA}" \
            backend

      - name: Verify Build Images
        run: |
          echo "Built Docker images:"
          docker images "linksphere/*" \
            --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/172614450127/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: linksphere-ci@linksphere-backend-dev.iam.gserviceaccount.com

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker asia-south2-docker.pkg.dev --quiet

      - name: Verify Artifact Registry
        run: |
          gcloud artifacts repositories list \
            --project=linksphere-backend-dev \
            --location=asia-south2

      - name: Tag Auth Service Image
        if: github.event_name == 'push' && contains(steps.affected.outputs.affected_services, 'auth-service')
        run: |
          docker tag \
            "linksphere/auth-service:${GITHUB_SHA}" \
            "asia-south2-docker.pkg.dev/linksphere-backend-dev/linksphere-dev/auth-service:${GITHUB_SHA}"

      - name: Push Auth Service Image
        if: github.event_name == 'push' && contains(steps.affected.outputs.affected_services, 'auth-service')
        run: |
          echo "Pushing auth-service..."

          docker push "asia-south2-docker.pkg.dev/linksphere-backend-dev/linksphere-dev/auth-service:${GITHUB_SHA}"

      - name: Tag User Service Image
        if: github.event_name == 'push' && contains(steps.affected.outputs.affected_services, 'user-service')
        run: |
          docker tag \
            "linksphere/user-service:${GITHUB_SHA}" \
            "asia-south2-docker.pkg.dev/linksphere-backend-dev/linksphere-dev/user-service:${GITHUB_SHA}"

      - name: Push User Service Image
        if: github.event_name == 'push' && contains(steps.affected.outputs.affected_services, 'user-service')
        run: |
          echo "Pushing user-service..."

          docker push "asia-south2-docker.pkg.dev/linksphere-backend-dev/linksphere-dev/user-service:${GITHUB_SHA}"

      - name: Tag Notification Service Image
        if: github.event_name == 'push' && contains(steps.affected.outputs.affected_services, 'notification-service')
        run: |
          docker tag \
            "linksphere/notification-service:${GITHUB_SHA}" \
            "asia-south2-docker.pkg.dev/linksphere-backend-dev/linksphere-dev/notification-service:${GITHUB_SHA}"

      - name: Push Notification Service Image
        if: github.event_name == 'push' && contains(steps.affected.outputs.affected_services, 'notification-service')
        run: |
          echo "Pushing notification-service..."

          docker push "asia-south2-docker.pkg.dev/linksphere-backend-dev/linksphere-dev/notification-service:${GITHUB_SHA}"

      - name: Tag Gateway Service Image
        if: github.event_name == 'push' && contains(steps.affected.outputs.affected_services, 'gateway-service')
        run: |
          docker tag \
            "linksphere/gateway-service:${GITHUB_SHA}" \
            "asia-south2-docker.pkg.dev/linksphere-backend-dev/linksphere-dev/gateway-service:${GITHUB_SHA}"

      - name: Push Gateway Service Image
        if: github.event_name == 'push' && contains(steps.affected.outputs.affected_services, 'gateway-service')
        run: |
          echo "Pushing gateway-service..."

          docker push "asia-south2-docker.pkg.dev/linksphere-backend-dev/linksphere-dev/gateway-service:${GITHUB_SHA}"

      - name: Tag Discovery Server Image
        if: github.event_name == 'push' && contains(steps.affected.outputs.affected_services, 'discovery-server')
        run: |
          docker tag \
            "linksphere/discovery-server:${GITHUB_SHA}" \
            "asia-south2-docker.pkg.dev/linksphere-backend-dev/linksphere-dev/discovery-server:${GITHUB_SHA}"

      - name: Push Discovery Server Image
        if: github.event_name == 'push' && contains(steps.affected.outputs.affected_services, 'discovery-server')
        run: |
          echo "Pushing discovery-server..."

          docker push "asia-south2-docker.pkg.dev/linksphere-backend-dev/linksphere-dev/discovery-server:${GITHUB_SHA}"
