name: Backend CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"

      - name: Verify Java
        run: "java --version"

      - name: Make Maven Wrapper Executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Verify Maven
        working-directory: backend
        run: "./mvnw --version"

      - name: Build Backend
        working-directory: backend
        run: "./mvnw clean verify -DskipTests"
      
      
