name: Backend CI/CD

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build:
    name: Backend Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================================
      # JAVA
      # =========================================================

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Verify Java
        run: java --version

      # =========================================================
      # MAVEN
      # =========================================================

      - name: Make Maven Wrapper Executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Verify Maven
        working-directory: backend
        run: ./mvnw --version

      - name: Build Backend
        working-directory: backend
        run: ./mvnw clean verify -DskipTests

      # =========================================================
      # DETECT AFFECTED SERVICES
      # =========================================================

      - name: Detect Affected Services
        id: affected
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          chmod +x scripts/detect-affected-services.sh

          ./scripts/detect-affected-services.sh \
            "$BASE_SHA" \
            "$HEAD_SHA"

      - name: Show Affected Services
        env:
          AFFECTED_SERVICES: ${{ steps.affected.outputs.affected_services }}
        run: |
          echo "======================================"
          echo "Affected services:"
          echo "======================================"

          printf '%s\n' "$AFFECTED_SERVICES"

      # =========================================================
      # DOCKER / BUILDX
      # =========================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      # =========================================================
      # GITHUB CONTAINER REGISTRY
      # =========================================================

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================
      # AUTH SERVICE
      # =========================================================

      - name: Build Auth Service Image
        if: contains(steps.affected.outputs.affected_services, 'auth-service')
        run: |
          echo "======================================"
          echo "Building auth-service"
          echo "Platform: linux/amd64"
          echo "======================================"

          docker buildx build \
            --platform linux/amd64 \
            -f backend/services/auth-service/Dockerfile \
            -t "linksphere/auth-service:${GITHUB_SHA}" \
            --load \
            backend

      # =========================================================
      # USER SERVICE
      # =========================================================

      - name: Build User Service Image
        if: contains(steps.affected.outputs.affected_services, 'user-service')
        run: |
          echo "======================================"
          echo "Building user-service"
          echo "Platform: linux/amd64"
          echo "======================================"

          docker buildx build \
            --platform linux/amd64 \
            -f backend/services/user-service/Dockerfile \
            -t "linksphere/user-service:${GITHUB_SHA}" \
            --load \
            backend

      # =========================================================
      # NOTIFICATION SERVICE
      # =========================================================

      - name: Build Notification Service Image
        if: contains(steps.affected.outputs.affected_services, 'notification-service')
        run: |
          echo "======================================"
          echo "Building notification-service"
          echo "Platform: linux/amd64"
          echo "======================================"

          docker buildx build \
            --platform linux/amd64 \
            -f backend/services/notification-service/Dockerfile \
            -t "linksphere/notification-service:${GITHUB_SHA}" \
            --load \
            backend

      # =========================================================
      # GATEWAY SERVICE
      # =========================================================

      - name: Build Gateway Service Image
        if: contains(steps.affected.outputs.affected_services, 'gateway-service')
        run: |
          echo "======================================"
          echo "Building gateway-service"
          echo "Platform: linux/amd64"
          echo "======================================"

          docker buildx build \
            --platform linux/amd64 \
            -f backend/services/gateway-service/Dockerfile \
            -t "linksphere/gateway-service:${GITHUB_SHA}" \
            --load \
            backend

      # =========================================================
      # DISCOVERY SERVER
      # =========================================================

      - name: Build Discovery Server Image
        if: contains(steps.affected.outputs.affected_services, 'discovery-server')
        run: |
          echo "======================================"
          echo "Building discovery-server"
          echo "Platform: linux/amd64"
          echo "======================================"

          docker buildx build \
            --platform linux/amd64 \
            -f backend/services/discovery-server/Dockerfile \
            -t "linksphere/discovery-server:${GITHUB_SHA}" \
            --load \
            backend

      # =========================================================
      # VERIFY IMAGES
      # =========================================================

      - name: Verify Build Images
        run: |
          echo "======================================"
          echo "Built Docker images:"
          echo "======================================"

          docker images "linksphere/*" \
            --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

          echo ""
          echo "======================================"
          echo "Image architectures:"
          echo "======================================"

          for image in $(docker images "linksphere/*" \
            --format "{{.Repository}}:{{.Tag}}"); do

            echo -n "$image -> "

            docker image inspect "$image" \
              --format '{{.Os}}/{{.Architecture}}'
          done

      # =========================================================
      # PUSH DISCOVERY SERVER TO GHCR
      # =========================================================

      - name: Push Discovery Server Image to GHCR
        if: contains(steps.affected.outputs.affected_services, 'discovery-server')
        run: |
          echo "======================================"
          echo "Pushing discovery-server to GHCR"
          echo "======================================"

          docker tag \
            "linksphere/discovery-server:${GITHUB_SHA}" \
            "ghcr.io/${{ github.repository_owner }}/linksphere-discovery-server:${GITHUB_SHA}"

          docker push \
            "ghcr.io/${{ github.repository_owner }}/linksphere-discovery-server:${GITHUB_SHA}"

      # =========================================================
      # PUSH API GATEWAY TO GHCR
      # =========================================================

      - name: Push API Gateway Image to GHCR
        if: contains(steps.affected.outputs.affected_services, 'gateway-service')
        run: |
          echo "======================================"
          echo "Pushing gateway-service to GHCR"
          echo "======================================"

          docker tag \
            "linksphere/gateway-service:${GITHUB_SHA}" \
            "ghcr.io/${{ github.repository_owner }}/linksphere-gateway-service:${GITHUB_SHA}"

          docker push \
            "ghcr.io/${{ github.repository_owner }}/linksphere-gateway-service:${GITHUB_SHA}"

      # =========================================================
      # PUSH AUTH SERVICE TO GHCR
      # =========================================================

      - name: Push Auth Service Image to GHCR
        if: contains(steps.affected.outputs.affected_services, 'auth-service')
        run: |
          echo "======================================"
          echo "Pushing auth-service to GHCR"
          echo "======================================"

          docker tag \
            "linksphere/auth-service:${GITHUB_SHA}" \
            "ghcr.io/${{ github.repository_owner }}/linksphere-auth-service:${GITHUB_SHA}"

          docker push \
            "ghcr.io/${{ github.repository_owner }}/linksphere-auth-service:${GITHUB_SHA}"

      # =========================================================
      # PUSH USER SERVICE TO GHCR
      # =========================================================

      - name: Push User Service Image to GHCR
        if: contains(steps.affected.outputs.affected_services, 'user-service')
        run: |
          echo "======================================"
          echo "Pushing user-service to GHCR"
          echo "======================================"

          docker tag \
            "linksphere/user-service:${GITHUB_SHA}" \
            "ghcr.io/${{ github.repository_owner }}/linksphere-user-service:${GITHUB_SHA}"

          docker push \
            "ghcr.io/${{ github.repository_owner }}/linksphere-user-service:${GITHUB_SHA}"

      # =========================================================
      # PUSH NOTIFICATION SERVICE TO GHCR
      # =========================================================

      - name: Push Notification Service Image to GHCR
        if: contains(steps.affected.outputs.affected_services, 'notification-service')
        run: |
          echo "======================================"
          echo "Pushing notification-service to GHCR"
          echo "======================================"

          docker tag \
            "linksphere/notification-service:${GITHUB_SHA}" \
            "ghcr.io/${{ github.repository_owner }}/linksphere-notification-service:${GITHUB_SHA}"

          docker push \
            "ghcr.io/${{ github.repository_owner }}/linksphere-notification-service:${GITHUB_SHA}"
